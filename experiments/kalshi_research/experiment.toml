[experiment]
name = "kalshi_research"
entrypoint = "experiments.kalshi_research.experiment"
status = "paused"           # Intentional 2026-09-22; docs/PLAN-2026-09-22-RESEARCH-REVAMP.md
description = """
Same domain and same fitness function as kalshi-quant, but a candidate is an
AGENT, not a function: it may search news, read sources, and reason per market
before emitting a probability.

This is a separate experiment, not a flag on kalshi-quant, because it changes
the cost model by orders of magnitude — every candidate evaluation becomes
dozens of model calls instead of microseconds of arithmetic. Sharing a fitness
function with kalshi-quant is the point: it makes the two directly comparable,
and that comparison ("does research-time buy calibration?") is the actual
research question.

Unblocked 2026-09-09: kalshi_quant has three generations and a definitive
null on the book alone (0/39 pass the P&L gate; generation 1 refuted at
0.4-0.6c resolution). Evaluated FORWARD ONLY from a live forecast log --
replay would leak outcomes through the search box. See forecast_log.py.
"""

[fitness]
primary = "brier_skill_vs_market"
secondary = ["paper_pnl", "research_calls_per_market"]

[cadence]
# forward-only: a generation is judged when its forecasts have resolved
runner_minutes = 15
max_close_hours = 1
max_markets_per_pass = 300
research_budget_per_market = 3
